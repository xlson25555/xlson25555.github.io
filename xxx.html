<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пончиковый обжора</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            text-align: center;
        }
        
        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            margin: 20px auto;
            border: 3px solid #333;
            background-color: #e6f7ff;
            overflow: hidden;
        }
        
        #player {
            position: absolute;
            width: 80px;
            height: 100px;
            bottom: 20px;
            left: 360px;
            z-index: 10;
        }
        
        .donut {
            position: absolute;
            width: 50px;
            height: 50px;
            z-index: 5;
        }
        
        #controls {
            margin: 20px;
        }
        
        button {
            padding: 10px 20px;
            font-size: 18px;
            margin: 0 10px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }
        
        button:hover {
            background-color: #45a049;
        }
        
        #score-display {
            font-size: 24px;
            margin: 10px;
        }
        
        #lives-display {
            font-size: 24px;
            margin: 10px;
            color: #e74c3c;
        }
        
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            color: #e74c3c;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>
    <h1>Пончиковый обжора</h1>
    
    <div id="controls">
        <button id="start-btn">Начать игру</button>
    </div>
    
    <div id="score-display">Очки: 0</div>
    <div id="lives-display">Жизни: ❤️❤️❤️</div>
    
    <div id="game-container">
        <img id="player" src="human.png" alt="Игрок">
        <div id="game-over">Игра окончена!</div>
    </div>
    
    <audio id="eat-sound" src="eat.mp3" preload="auto"></audio>
    
    <script>
        // Элементы игры
        const gameContainer = document.getElementById('game-container');
        const player = document.getElementById('player');
        const startBtn = document.getElementById('start-btn');
        const scoreDisplay = document.getElementById('score-display');
        const livesDisplay = document.getElementById('lives-display');
        const gameOverDisplay = document.getElementById('game-over');
        const eatSound = document.getElementById('eat-sound');
        
        // Переменные игры
        let score = 0;
        let lives = 3;
        let gameActive = false;
        let donuts = [];
        let playerX = 360;
        let gameSpeed = 2;
        let donutInterval;
        let gameLoop;
        
        // Обработчики кнопок
        startBtn.addEventListener('click', startGame);
        
        // Обработчики клавиатуры
        document.addEventListener('keydown', movePlayer);
        
        // Функция начала игры
        function startGame() {
            if (gameActive) return;
            
            // Сброс параметров игры
            gameActive = true;
            score = 0;
            lives = 3;
            playerX = 360;
            player.style.left = `${playerX}px`;
            scoreDisplay.textContent = `Очки: ${score}`;
            livesDisplay.textContent = `Жизни: ${'❤️'.repeat(lives)}`;
            gameOverDisplay.style.display = 'none';
            
            // Очистка пончиков
            donuts.forEach(donut => donut.element.remove());
            donuts = [];
            
            // Запуск генерации пончиков
            donutInterval = setInterval(createDonut, 1000);
            
            // Запуск игрового цикла
            gameLoop = setInterval(updateGame, 20);
        }
        
        // Функция движения игрока
        function movePlayer(e) {
            if (!gameActive) return;
            
            const step = 20;
            
            if (e.key === 'ArrowLeft' && playerX > 0) {
                playerX -= step;
            } else if (e.key === 'ArrowRight' && playerX < gameContainer.offsetWidth - player.offsetWidth) {
                playerX += step;
            }
            
            player.style.left = `${playerX}px`;
        }
        
        // Функция создания пончика
        function createDonut() {
            if (!gameActive) return;
            
            const donut = document.createElement('img');
            donut.className = 'donut';
            donut.src = "donut.png";
            
            const x = Math.random() * (gameContainer.offsetWidth - 50);
            const y = -50;
            
            donut.style.left = `${x}px`;
            donut.style.top = `${y}px`;
            
            gameContainer.appendChild(donut);
            
            donuts.push({
                element: donut,
                x: x,
                y: y,
                speed: 2 + Math.random() * gameSpeed
            });
        }
        
        // Функция обновления игры
        function updateGame() {
            if (!gameActive) return;
            
            // Двигаем пончики
            for (let i = donuts.length - 1; i >= 0; i--) {
                const donut = donuts[i];
                donut.y += donut.speed;
                donut.element.style.top = `${donut.y}px`;
                
                // Проверка столкновения с игроком
                if (
                    donut.y + 50 > gameContainer.offsetHeight - 120 &&
                    donut.y < gameContainer.offsetHeight - 20 &&
                    donut.x + 50 > playerX &&
                    donut.x < playerX + 80
                ) {
                    // Пойман пончик
                    eatSound.currentTime = 0;
                    eatSound.play();
                    donut.element.remove();
                    donuts.splice(i, 1);
                    score += 10;
                    scoreDisplay.textContent = `Очки: ${score}`;
                    
                    // Увеличиваем сложность
                    if (score % 50 === 0) {
                        gameSpeed += 0.5;
                    }
                    
                    continue;
                }
                
                // Пончик упал за пределы экрана
                if (donut.y > gameContainer.offsetHeight) {
                    donut.element.remove();
                    donuts.splice(i, 1);
                    lives--;
                    livesDisplay.textContent = `Жизни: ${'❤️'.repeat(lives)}`;
                    
                    if (lives <= 0) {
                        endGame();
                    }
                }
            }
        }
        
        // Функция завершения игры
        function endGame() {
            gameActive = false;
            clearInterval(donutInterval);
            clearInterval(gameLoop);
            gameOverDisplay.style.display = 'block';
        }
    </script>
</body>
</html>
