<!DOCTYPE html>
<html>
<head>
    <title>Поедание пончиков</title>
    <style>
        #gameArea {
            width: 600px;
            height: 400px;
            border: 2px solid black;
            position: relative;
            overflow: hidden;
            background: lightblue;
        }
        #player {
            position: absolute;
            bottom: 10px;
            width: 50px;
            height: 50px;
        }
        .donut {
            position: absolute;
            width: 30px;
            height: 30px;
        }
        .controls {
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="controls">
        <button onclick="startGame()">Начало игры</button>
        <button onclick="showRecord()">Рекорд</button>
        <span>Счёт: <span id="score">0</span></span>
    </div>
    <div id="gameArea">
        <img id="player" src="human.png" style="display: none;">
    </div>

    <script>
        let player;
        let score = 0;
        let gameActive = false;
        let record = localStorage.getItem('donutRecord') || 0;
        let donuts = [];
        
        function startGame() {
            if(gameActive) return;
            
            // Сброс игры
            score = 0;
            gameActive = true;
            document.getElementById('score').textContent = '0';
            player = document.getElementById('player');
            player.style.display = 'block';
            player.style.left = '275px';
            
            // Очистка пончиков
            donuts.forEach(d => d.remove());
            donuts = [];
            
            // Запуск логики
            document.addEventListener('keydown', movePlayer);
            setInterval(createDonut, 2000);
            setInterval(gameLoop, 20);
        }

        function createDonut() {
            if(!gameActive) return;
            
            const donut = document.createElement('img');
            donut.src = 'donut.png';
            donut.className = 'donut';
            donut.style.left = Math.random() * 570 + 'px';
            donut.style.top = '0px';
            document.getElementById('gameArea').appendChild(donut);
            donuts.push(donut);
        }

        function gameLoop() {
            if(!gameActive) return;
            
            // Движение пончиков
            donuts.forEach((donut, index) => {
                const top = parseInt(donut.style.top) || 0;
                donut.style.top = top + 3 + 'px';
                
                // Проверка столкновения
                if(checkCollision(player, donut)) {
                    donut.remove();
                    donuts.splice(index, 1);
                    score++;
                    document.getElementById('score').textContent = score;
                }
                
                // Удаление упавших пончиков
                if(top > 400) {
                    donut.remove();
                    donuts.splice(index, 1);
                }
            });
        }

        function checkCollision(player, donut) {
            const playerRect = player.getBoundingClientRect();
            const donutRect = donut.getBoundingClientRect();
            
            return !(donutRect.right < playerRect.left || 
                   donutRect.left > playerRect.right || 
                   donutRect.bottom < playerRect.top || 
                   donutRect.top > playerRect.bottom);
        }

        function movePlayer(e) {
            if(!gameActive) return;
            
            const left = parseInt(player.style.left);
            if(e.key === 'ArrowLeft' && left > 0) {
                player.style.left = left - 10 + 'px';
            }
            if(e.key === 'ArrowRight' && left < 550) {
                player.style.left = left + 10 + 'px';
            }
        }

        function showRecord() {
            alert(`Текущий рекорд: ${record}`);
        }

        // Сохранение рекорда при закрытии
        window.addEventListener('beforeunload', () => {
            if(score > record) {
                localStorage.setItem('donutRecord', score);
            }
        });
    </script>
</body>
</html>
