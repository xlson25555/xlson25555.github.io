<!DOCTYPE html>
<html>
<head>
    <title>Поедание пончиков</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            touch-action: none;
        }
        #gameArea {
            width: 100vw;
            height: 80vh;
            position: relative;
            overflow: hidden;
            background: url('bg.jpg') center/cover;
        }
        #player {
            position: absolute;
            bottom: 10px;
            width: 80px;
            height: 80px;
            transition: 0.1s;
        }
        .donut {
            position: absolute;
            width: 50px;
            height: 50px;
        }
        .controls {
            padding: 10px;
            background: #333;
            color: white;
            display: flex;
            justify-content: space-around;
        }
        button {
            padding: 10px 20px;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="controls">
        <button onclick="startGame()">Начало игры</button>
        <button onclick="showRecord()">Рекорд</button>
        <span>Счёт: <span id="score">0</span></span>
    </div>
    <div id="gameArea">
        <img id="player" src="human.png" style="display: none;">
    </div>

    <script>
        let player;
        let score = 0;
        let gameActive = false;
        let record = localStorage.getItem('donutRecord') || 0;
        let donuts = [];
        let touchX = 0;
        
        function startGame() {
            if(gameActive) return;
            
            score = 0;
            gameActive = true;
            document.getElementById('score').textContent = '0';
            player = document.getElementById('player');
            player.style.display = 'block';
            player.style.left = 'calc(50% - 40px)';
            
            donuts.forEach(d => d.remove());
            donuts = [];
            
            document.addEventListener('keydown', movePlayer);
            document.addEventListener('touchstart', handleTouch);
            document.addEventListener('touchmove', handleTouch);
            gameInterval = setInterval(createDonut, 1500);
            gameLoop();
        }

        function handleTouch(e) {
            e.preventDefault();
            const rect = gameArea.getBoundingClientRect();
            touchX = e.touches[0].clientX - rect.left;
            movePlayer({key: ''});
        }

        function createDonut() {
            if(!gameActive) return;
            
            const donut = document.createElement('img');
            donut.src = 'donut.png';
            donut.className = 'donut';
            donut.style.left = Math.random() * (window.innerWidth - 50) + 'px';
            donut.style.top = '0px';
            gameArea.appendChild(donut);
            donuts.push(donut);
        }

        function gameLoop() {
            if(!gameActive) return;
            
            donuts.forEach((donut, index) => {
                const top = parseInt(donut.style.top) || 0;
                donut.style.top = top + 5 + 'px';
                
                if(checkCollision(player, donut)) {
                    donut.remove();
                    donuts.splice(index, 1);
                    score++;
                    document.getElementById('score').textContent = score;
                }
                
                if(top > gameArea.offsetHeight) {
                    gameOver();
                }
            });
            
            requestAnimationFrame(gameLoop);
        }

        function checkCollision(a, b) {
            const aRect = a.getBoundingClientRect();
            const bRect = b.getBoundingClientRect();
            
            return !(bRect.right < aRect.left || 
                   bRect.left > aRect.right || 
                   bRect.bottom < aRect.top || 
                   bRect.top > aRect.bottom);
        }

        function movePlayer(e) {
            if(!gameActive) return;
            
            const playerWidth = 80;
            let newX;
            
            if(e.key === 'ArrowLeft') {
                newX = parseInt(player.style.left) - 20;
            } else if(e.key === 'ArrowRight') {
                newX = parseInt(player.style.left) + 20;
            } else {
                newX = touchX - playerWidth/2;
            }
            
            newX = Math.max(0, Math.min(newX, gameArea.offsetWidth - playerWidth));
            player.style.left = newX + 'px';
        }

        function gameOver() {
            gameActive = false;
            clearInterval(gameInterval);
            player.style.display = 'none';
            donuts.forEach(d => d.remove());
            donuts = [];
            
            if(score > record) {
                record = score;
                localStorage.setItem('donutRecord', record);
            }
            
            alert(`Игра окончена! Счёт: ${score}\nРекорд: ${record}`);
        }

        function showRecord() {
            alert(`Текущий рекорд: ${record}`);
        }
    </script>
</body>
</html>
