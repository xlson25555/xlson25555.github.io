<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Пончиковый обжора</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            touch-action: manipulation;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100vh;
            max-width: 800px;
            max-height: 600px;
            margin: 0 auto;
            border: 3px solid #333;
            background-color: #e6f7ff;
            overflow: hidden;
        }
        #player {
            position: absolute;
            width: 80px;
            height: 120px;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-image: url('human.png');
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 10;
        }
        .donut {
            position: absolute;
            width: 40px;
            height: 40px;
            background-image: url('donut.png');
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 5;
        }
        .donut.special {
            background-image: url('donut2.png');
            width: 50px;
            height: 50px;
            animation: glow 0.5s infinite alternate;
        }
        @keyframes glow {
            from {
                filter: drop-shadow(0 0 5px gold);
            }
            to {
                filter: drop-shadow(0 0 15px gold);
            }
        }
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: white;
        }
        #startButton {
            padding: 15px 30px;
            font-size: 24px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }
        #startButton:hover {
            background-color: #45a049;
        }
        #scoreBoard {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 24px;
            color: #333;
            z-index: 15;
            background-color: rgba(255, 255, 255, 0.7);
            padding: 5px 10px;
            border-radius: 5px;
        }
        #lives {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 24px;
            color: #333;
            z-index: 15;
            background-color: rgba(255, 255, 255, 0.7);
            padding: 5px 10px;
            border-radius: 5px;
        }
        .heart {
            color: red;
            font-size: 28px;
        }
        #gameOver {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: white;
        }
        #nameInput {
            padding: 10px;
            font-size: 18px;
            margin: 10px 0;
            width: 200px;
            text-align: center;
        }
        #saveScoreButton {
            padding: 15px 30px;
            font-size: 24px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
        }
        #saveScoreButton:hover {
            background-color: #45a049;
        }
        #restartButton {
            padding: 15px 30px;
            font-size: 24px;
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }
        #restartButton:hover {
            background-color: #d32f2f;
        }
        #leaderboard {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 25;
            color: white;
        }
        #leaderboardTable {
            width: 80%;
            max-width: 500px;
            border-collapse: collapse;
            margin: 20px 0;
            background-color: rgba(255, 255, 255, 0.2);
        }
        #leaderboardTable th, #leaderboardTable td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }
        #leaderboardTable th {
            background-color: rgba(0, 0, 0, 0.5);
        }
        #leaderboardTable tr:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.1);
        }
        #leaderboardButton {
            padding: 15px 30px;
            font-size: 24px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }
        #leaderboardButton:hover {
            background-color: #0b7dda;
        }
        #backButton {
            padding: 15px 30px;
            font-size: 24px;
            background-color: #ff9800;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }
        #backButton:hover {
            background-color: #e68a00;
        }
        #controls {
            position: absolute;
            bottom: 10px;
            width: 100%;
            display: none;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 30;
        }
        .control-btn {
            width: 80px;
            height: 80px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .control-btn:active {
            background-color: rgba(0, 0, 0, 0.7);
        }
        #mobileControlsToggle {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            border-radius: 5px;
            z-index: 40;
            display: none;
        }
        @media (max-width: 768px) {
            #mobileControlsToggle {
                display: block;
            }
            #controls {
                display: flex;
            }
            #player {
                width: 60px;
                height: 90px;
            }
            .donut {
                width: 30px;
                height: 30px;
            }
            .donut.special {
                width: 40px;
                height: 40px;
            }
            .control-btn {
                width: 60px;
                height: 60px;
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="player"></div>
        <div id="scoreBoard">Очки: 0</div>
        <div id="lives">
            Жизни: 
            <span class="heart">♥</span>
            <span class="heart">♥</span>
            <span class="heart">♥</span>
        </div>
        
        <div id="controls">
            <div class="control-btn" id="leftBtn">←</div>
            <div class="control-btn" id="rightBtn">→</div>
        </div>
        
        <button id="mobileControlsToggle">Управление</button>
        
        <div id="startScreen">
            <h1>Пончиковый обжора</h1>
            <p>Лови падающие пончики!</p>
            <p>Золотые пончики дают 100 очков!</p>
            <p>Управление: стрелки или кнопки внизу</p>
            <button id="startButton">Начать игру</button>
            <button id="leaderboardButton">Таблица лидеров</button>
        </div>
        
        <div id="gameOver">
            <h1>Игра окончена!</h1>
            <p id="finalScore">Ваш счет: 0</p>
            <input type="text" id="nameInput" placeholder="Введите ваше имя" maxlength="15">
            <button id="saveScoreButton">Сохранить результат</button>
            <button id="restartButton">Играть снова</button>
        </div>
        
        <div id="leaderboard">
            <h1>Таблица лидеров</h1>
            <table id="leaderboardTable">
                <thead>
                    <tr>
                        <th>Место</th>
                        <th>Имя</th>
                        <th>Очки</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody">
                    <!-- Таблица будет заполняться динамически -->
                </tbody>
            </table>
            <button id="backButton">Назад</button>
        </div>
    </div>

    <script>
        // Игровые переменные
        let score = 0;
        let lives = 3;
        let gameRunning = false;
        let donutInterval;
        let specialDonutInterval;
        let gameSpeed = 2000;
        let playerSpeed = 8;
        let playerPosition = 50;
        let keysPressed = {};
        let moveInterval;
        let isMobile = false;
        
        // Элементы DOM
        const gameContainer = document.getElementById('gameContainer');
        const player = document.getElementById('player');
        const scoreBoard = document.getElementById('scoreBoard');
        const livesDisplay = document.getElementById('lives');
        const startScreen = document.getElementById('startScreen');
        const startButton = document.getElementById('startButton');
        const gameOverScreen = document.getElementById('gameOver');
        const finalScoreDisplay = document.getElementById('finalScore');
        const restartButton = document.getElementById('restartButton');
        const hearts = document.querySelectorAll('.heart');
        const nameInput = document.getElementById('nameInput');
        const saveScoreButton = document.getElementById('saveScoreButton');
        const leaderboard = document.getElementById('leaderboard');
        const leaderboardButton = document.getElementById('leaderboardButton');
        const backButton = document.getElementById('backButton');
        const leaderboardBody = document.getElementById('leaderboardBody');
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');
        const mobileControlsToggle = document.getElementById('mobileControlsToggle');
        const controls = document.getElementById('controls');
        
        // Размеры игрового поля
        const gameWidth = gameContainer.offsetWidth;
        const gameHeight = gameContainer.offsetHeight;
        
        // Лучшие результаты
        let highScores = JSON.parse(localStorage.getItem('donutHighScores')) || [];
        
        // Проверка мобильного устройства
        function checkMobile() {
            isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            if (isMobile) {
                controls.style.display = 'flex';
                mobileControlsToggle.style.display = 'block';
            }
        }
        
        // Обработчики событий
        startButton.addEventListener('click', startGame);
        restartButton.addEventListener('click', restartGame);
        leaderboardButton.addEventListener('click', showLeaderboard);
        backButton.addEventListener('click', hideLeaderboard);
        saveScoreButton.addEventListener('click', saveScore);
        leftBtn.addEventListener('touchstart', () => keysPressed['ArrowLeft'] = true);
        leftBtn.addEventListener('touchend', () => keysPressed['ArrowLeft'] = false);
        rightBtn.addEventListener('touchstart', () => keysPressed['ArrowRight'] = true);
        rightBtn.addEventListener('touchend', () => keysPressed['ArrowRight'] = false);
        mobileControlsToggle.addEventListener('click', toggleControls);
        
        // Клавиатурное управление
        document.addEventListener('keydown', (e) => {
            if (['ArrowLeft', 'ArrowRight'].includes(e.key)) {
                keysPressed[e.key] = true;
                if (!moveInterval) {
                    movePlayer();
                    moveInterval = setInterval(movePlayer, 20);
                }
            }
        });
        
        document.addEventListener('keyup', (e) => {
            if (['ArrowLeft', 'ArrowRight'].includes(e.key)) {
                keysPressed[e.key] = false;
                if (!keysPressed['ArrowLeft'] && !keysPressed['ArrowRight']) {
                    clearInterval(moveInterval);
                    moveInterval = null;
                }
            }
        });
        
        // Переключение видимости кнопок управления
        function toggleControls() {
            controls.style.display = controls.style.display === 'none' ? 'flex' : 'none';
        }
        
        // Функция старта игры
        function startGame() {
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            leaderboard.style.display = 'none';
            resetGame();
            gameRunning = true;
            
            // Очистка всех пончиков
            document.querySelectorAll('.donut').forEach(donut => donut.remove());
            
            // Запуск генерации пончиков
            donutInterval = setInterval(createDonut, gameSpeed);
            
            // Запуск генерации редких пончиков (каждые 10-15 секунд)
            specialDonutInterval = setInterval(createSpecialDonut, 10000 + Math.random() * 5000);
        }
        
        // Функция рестарта игры
        function restartGame() {
            gameOverScreen.style.display = 'none';
            resetGame();
            gameRunning = true;
            
            // Очистка всех пончиков
            document.querySelectorAll('.donut').forEach(donut => donut.remove());
            
            // Запуск генерации пончиков
            donutInterval = setInterval(createDonut, gameSpeed);
            specialDonutInterval = setInterval(createSpecialDonut, 10000 + Math.random() * 5000);
        }
        
        // Сброс игровых параметров
        function resetGame() {
            score = 0;
            lives = 3;
            gameSpeed = 2000;
            playerSpeed = 8;
            playerPosition = 50;
            player.style.left = '50%';
            updateScore();
            updateLives();
            keysPressed = {};
            if (moveInterval) {
                clearInterval(moveInterval);
                moveInterval = null;
            }
            clearInterval(specialDonutInterval);
        }
        
        // Создание обычного пончика
        function createDonut() {
            if (!gameRunning) return;
            
            const donut = document.createElement('div');
            donut.className = 'donut';
            
            // Случайная позиция по X
            const xPos = Math.floor(Math.random() * (gameWidth - 40));
            donut.style.left = xPos + 'px';
            donut.style.top = '0px';
            
            gameContainer.appendChild(donut);
            
            // Анимация падения пончика
            let fallInterval = setInterval(() => {
                if (!gameRunning) {
                    clearInterval(fallInterval);
                    return;
                }
                
                const currentTop = parseInt(donut.style.top);
                const newTop = currentTop + 3;
                donut.style.top = newTop + 'px';
                
                // Проверка столкновения с игроком
                if (checkCollision(donut, player)) {
                    clearInterval(fallInterval);
                    donut.remove();
                    score += 10;
                    updateScore();
                    
                    // Увеличиваем сложность
                    if (score % 50 === 0 && gameSpeed > 600) {
                        gameSpeed -= 100;
                        clearInterval(donutInterval);
                        donutInterval = setInterval(createDonut, gameSpeed);
                    }
                }
                
                // Пончик упал за пределы экрана
                if (newTop > gameHeight) {
                    clearInterval(fallInterval);
                    donut.remove();
                    loseLife();
                }
            }, 30);
        }
        
        // Создание редкого пончика
        function createSpecialDonut() {
            if (!gameRunning) return;
            
            const donut = document.createElement('div');
            donut.className = 'donut special';
            
            // Случайная позиция по X
            const xPos = Math.floor(Math.random() * (gameWidth - 50));
            donut.style.left = xPos + 'px';
            donut.style.top = '0px';
            
            gameContainer.appendChild(donut);
            
            // Анимация падения пончика (падает быстрее)
            let fallInterval = setInterval(() => {
                if (!gameRunning) {
                    clearInterval(fallInterval);
                    return;
                }
                
                const currentTop = parseInt(donut.style.top);
                const newTop = currentTop + 6; // Падает в 2 раза быстрее обычного
                donut.style.top = newTop + 'px';
                
                // Проверка столкновения с игроком
                if (checkCollision(donut, player)) {
                    clearInterval(fallInterval);
                    donut.remove();
                    score += 100; // Дает 100 очков
                    updateScore();
                    showBonusMessage();
                }
                
                // Пончик упал за пределы экрана
                if (newTop > gameHeight) {
                    clearInterval(fallInterval);
                    donut.remove();
                }
            }, 20); // Более плавное падение
        }
        
        // Показать сообщение о бонусе
        function showBonusMessage() {
            const bonus = document.createElement('div');
            bonus.textContent = '+100';
            bonus.style.position = 'absolute';
            bonus.style.left = playerPosition + 'px';
            bonus.style.bottom = '150px';
            bonus.style.color = 'gold';
            bonus.style.fontSize = '30px';
            bonus.style.fontWeight = 'bold';
            bonus.style.textShadow = '0 0 5px black';
            bonus.style.zIndex = '20';
            bonus.style.animation = 'fadeUp 1s forwards';
            
            document.styleSheets[0].insertRule(`
                @keyframes fadeUp {
                    0% { opacity: 1; transform: translateY(0); }
                    100% { opacity: 0; transform: translateY(-50px); }
                }
            `);
            
            gameContainer.appendChild(bonus);
            
            setTimeout(() => {
                bonus.remove();
            }, 1000);
        }
        
        // Проверка столкновения
        function checkCollision(donut, player) {
            const donutRect = donut.getBoundingClientRect();
            const playerRect = player.getBoundingClientRect();
            
            return !(
                donutRect.bottom < playerRect.top ||
                donutRect.top > playerRect.bottom ||
                donutRect.right < playerRect.left ||
                donutRect.left > playerRect.right
            );
        }
        
        // Потеря жизни
        function loseLife() {
            lives--;
            updateLives();
            
            if (lives <= 0) {
                endGame();
            }
        }
        
        // Обновление счета
        function updateScore() {
            scoreBoard.textContent = `Очки: ${score}`;
        }
        
        // Обновление жизней
        function updateLives() {
            hearts.forEach((heart, index) => {
                if (index < lives) {
                    heart.style.visibility = 'visible';
                } else {
                    heart.style.visibility = 'hidden';
                }
            });
        }
        
        // Конец игры
        function endGame() {
            gameRunning = false;
            clearInterval(donutInterval);
            clearInterval(specialDonutInterval);
            finalScoreDisplay.textContent = `Ваш счет: ${score}`;
            gameOverScreen.style.display = 'flex';
            nameInput.focus();
        }
        
        // Управление игроком
        function movePlayer() {
            if (!gameRunning) return;
            
            if (keysPressed['ArrowLeft']) {
                playerPosition = Math.max(0, playerPosition - playerSpeed);
            }
            if (keysPressed['ArrowRight']) {
                playerPosition = Math.min(100, playerPosition + playerSpeed);
            }
            
            player.style.left = `calc(${playerPosition}% - ${player.offsetWidth / 2}px)`;
        }
        
        // Сохранение результата
        function saveScore() {
            const playerName = nameInput.value.trim() || 'Аноним';
            
            if (playerName.length > 0) {
                highScores.push({
                    name: playerName,
                    score: score,
                    date: new Date().toLocaleDateString()
                });
                
                // Сортировка по убыванию очков
                highScores.sort((a, b) => b.score - a.score);
                
                // Оставляем только топ-10
                if (highScores.length > 10) {
                    highScores = highScores.slice(0, 10);
                }
                
                // Сохраняем в localStorage
                localStorage.setItem('donutHighScores', JSON.stringify(highScores));
                
                // Показываем таблицу лидеров
                showLeaderboard();
            }
        }
        
        // Показать таблицу лидеров
        function showLeaderboard() {
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            leaderboard.style.display = 'flex';
            
            // Очищаем таблицу
            leaderboardBody.innerHTML = '';
            
            // Заполняем таблицу
            highScores.forEach((entry, index) => {
                const row = document.createElement('tr');
                
                const placeCell = document.createElement('td');
                placeCell.textContent = index + 1;
                
                const nameCell = document.createElement('td');
                nameCell.textContent = entry.name;
                
                const scoreCell = document.createElement('td');
                scoreCell.textContent = entry.score;
                
                row.appendChild(placeCell);
                row.appendChild(nameCell);
                row.appendChild(scoreCell);
                
                leaderboardBody.appendChild(row);
            });
            
            // Если таблица пуста
            if (highScores.length === 0) {
                const row = document.createElement('tr');
                const cell = document.createElement('td');
                cell.colSpan = 3;
                cell.textContent = 'Пока нет рекордов!';
                row.appendChild(cell);
                leaderboardBody.appendChild(row);
            }
        }
        
        // Скрыть таблицу лидеров
        function hideLeaderboard() {
            leaderboard.style.display = 'none';
            startScreen.style.display = 'flex';
        }
        
        // Инициализация игры
        checkMobile();
        player.style.left = `calc(50% - ${player.offsetWidth / 2}px)`;
    </script>
</body>
</html>
