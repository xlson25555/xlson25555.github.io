<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пончиковый обжора</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
        }
        #gameContainer {
            position: relative;
            width: 800px;
            height: 600px;
            margin: 20px auto;
            border: 3px solid #333;
            background-color: #e6f7ff;
            overflow: hidden;
        }
        #player {
            position: absolute;
            width: 80px;
            height: 120px;
            bottom: 20px;
            left: 360px;
            background-image: url('human.png');
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 10;
        }
        .donut {
            position: absolute;
            width: 40px;
            height: 40px;
            background-image: url('donut.png');
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 5;
        }
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: white;
        }
        #startButton {
            padding: 15px 30px;
            font-size: 24px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }
        #startButton:hover {
            background-color: #45a049;
        }
        #scoreBoard {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 24px;
            color: #333;
            z-index: 15;
            background-color: rgba(255, 255, 255, 0.7);
            padding: 5px 10px;
            border-radius: 5px;
        }
        #lives {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 24px;
            color: #333;
            z-index: 15;
            background-color: rgba(255, 255, 255, 0.7);
            padding: 5px 10px;
            border-radius: 5px;
        }
        .heart {
            color: red;
            font-size: 28px;
        }
        #gameOver {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: white;
        }
        #restartButton {
            padding: 15px 30px;
            font-size: 24px;
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }
        #restartButton:hover {
            background-color: #d32f2f;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="player"></div>
        <div id="scoreBoard">Очки: 0</div>
        <div id="lives">
            Жизни: 
            <span class="heart">♥</span>
            <span class="heart">♥</span>
            <span class="heart">♥</span>
        </div>
        
        <div id="startScreen">
            <h1>Пончиковый обжора</h1>
            <p>Лови падающие пончики!</p>
            <p>Управление: стрелки влево/вправо (удерживайте для движения)</p>
            <button id="startButton">Начать игру</button>
        </div>
        
        <div id="gameOver">
            <h1>Игра окончена!</h1>
            <p id="finalScore">Ваш счет: 0</p>
            <button id="restartButton">Играть снова</button>
        </div>
    </div>

    <script>
        // Игровые переменные
        let score = 0;
        let lives = 3;
        let gameRunning = false;
        let donutInterval;
        let gameSpeed = 2000; // Увеличил начальную скорость появления пончиков (было 1500)
        let playerSpeed = 8;
        let playerPosition = 360;
        let keysPressed = {};
        let moveInterval;
        
        // Элементы DOM
        const gameContainer = document.getElementById('gameContainer');
        const player = document.getElementById('player');
        const scoreBoard = document.getElementById('scoreBoard');
        const livesDisplay = document.getElementById('lives');
        const startScreen = document.getElementById('startScreen');
        const startButton = document.getElementById('startButton');
        const gameOverScreen = document.getElementById('gameOver');
        const finalScoreDisplay = document.getElementById('finalScore');
        const restartButton = document.getElementById('restartButton');
        const hearts = document.querySelectorAll('.heart');
        
        // Размеры игрового поля
        const gameWidth = gameContainer.offsetWidth;
        const gameHeight = gameContainer.offsetHeight;
        
        // Обработчики событий
        startButton.addEventListener('click', startGame);
        restartButton.addEventListener('click', restartGame);
        document.addEventListener('keydown', (e) => {
            if (['ArrowLeft', 'ArrowRight'].includes(e.key)) {
                keysPressed[e.key] = true;
                if (!moveInterval) {
                    movePlayer();
                    moveInterval = setInterval(movePlayer, 20);
                }
            }
        });
        document.addEventListener('keyup', (e) => {
            if (['ArrowLeft', 'ArrowRight'].includes(e.key)) {
                keysPressed[e.key] = false;
                if (!keysPressed['ArrowLeft'] && !keysPressed['ArrowRight']) {
                    clearInterval(moveInterval);
                    moveInterval = null;
                }
            }
        });
        
        // Функция старта игры
        function startGame() {
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            resetGame();
            gameRunning = true;
            
            // Очистка всех пончиков
            document.querySelectorAll('.donut').forEach(donut => donut.remove());
            
            // Запуск генерации пончиков
            donutInterval = setInterval(createDonut, gameSpeed);
        }
        
        // Функция рестарта игры
        function restartGame() {
            gameOverScreen.style.display = 'none';
            resetGame();
            gameRunning = true;
            
            // Очистка всех пончиков
            document.querySelectorAll('.donut').forEach(donut => donut.remove());
            
            // Запуск генерации пончиков
            donutInterval = setInterval(createDonut, gameSpeed);
        }
        
        // Сброс игровых параметров
        function resetGame() {
            score = 0;
            lives = 3;
            gameSpeed = 2000; // Увеличил начальную скорость
            playerSpeed = 8;
            playerPosition = 360;
            player.style.left = playerPosition + 'px';
            updateScore();
            updateLives();
            keysPressed = {};
            if (moveInterval) {
                clearInterval(moveInterval);
                moveInterval = null;
            }
        }
        
        // Создание пончика
        function createDonut() {
            if (!gameRunning) return;
            
            const donut = document.createElement('div');
            donut.className = 'donut';
            
            // Случайная позиция по X
            const xPos = Math.floor(Math.random() * (gameWidth - 40));
            donut.style.left = xPos + 'px';
            donut.style.top = '0px';
            
            gameContainer.appendChild(donut);
            
            // Анимация падения пончика (уменьшил скорость падения)
            let fallInterval = setInterval(() => {
                if (!gameRunning) {
                    clearInterval(fallInterval);
                    return;
                }
                
                const currentTop = parseInt(donut.style.top);
                const newTop = currentTop + 3; // Уменьшил скорость падения (было 5)
                donut.style.top = newTop + 'px';
                
                // Проверка столкновения с игроком
                if (checkCollision(donut, player)) {
                    clearInterval(fallInterval);
                    donut.remove();
                    score += 10;
                    updateScore();
                    
                    // Увеличиваем сложность
                    if (score % 50 === 0 && gameSpeed > 600) {
                        gameSpeed -= 100;
                        clearInterval(donutInterval);
                        donutInterval = setInterval(createDonut, gameSpeed);
                    }
                }
                
                // Пончик упал за пределы экрана
                if (newTop > gameHeight) {
                    clearInterval(fallInterval);
                    donut.remove();
                    loseLife();
                }
            }, 30);
        }
        
        // Проверка столкновения
        function checkCollision(donut, player) {
            const donutRect = donut.getBoundingClientRect();
            const playerRect = player.getBoundingClientRect();
            
            return !(
                donutRect.bottom < playerRect.top ||
                donutRect.top > playerRect.bottom ||
                donutRect.right < playerRect.left ||
                donutRect.left > playerRect.right
            );
        }
        
        // Потеря жизни
        function loseLife() {
            lives--;
            updateLives();
            
            if (lives <= 0) {
                endGame();
            }
        }
        
        // Обновление счета
        function updateScore() {
            scoreBoard.textContent = `Очки: ${score}`;
        }
        
        // Обновление жизней
        function updateLives() {
            hearts.forEach((heart, index) => {
                if (index < lives) {
                    heart.style.visibility = 'visible';
                } else {
                    heart.style.visibility = 'hidden';
                }
            });
        }
        
        // Конец игры
        function endGame() {
            gameRunning = false;
            clearInterval(donutInterval);
            finalScoreDisplay.textContent = `Ваш счет: ${score}`;
            gameOverScreen.style.display = 'flex';
        }
        
        // Управление игроком
        function movePlayer() {
            if (!gameRunning) return;
            
            if (keysPressed['ArrowLeft']) {
                playerPosition = Math.max(0, playerPosition - playerSpeed);
            }
            if (keysPressed['ArrowRight']) {
                playerPosition = Math.min(gameWidth - 80, playerPosition + playerSpeed);
            }
            
            player.style.left = playerPosition + 'px';
        }
    </script>
</body>
</html>
